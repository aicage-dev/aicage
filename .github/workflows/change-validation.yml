name: Change Validation

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: change-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml

  integration-test:
    uses: ./.github/workflows/integration-test.yml

  integration-test-proxy:
    uses: ./.github/workflows/integration-test-proxy.yml

  required-checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - lint-and-test
      - integration-test
      - integration-test-proxy
    runs-on: ubuntu-latest
    steps:
      - name: Check validation job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status --arg event_name "$GITHUB_EVENT_NAME" \
            'all(.[]; .result == "success" or ($event_name == "push" and .result == "skipped"))' \
            <<< "$NEEDS"

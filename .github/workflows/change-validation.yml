name: Change Validation

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: change-validation-${{ github.workflow_ref }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-linter:
    name: Run super-linter
    uses: ./.github/workflows/ci_lint-super-linter.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  lint-and-test:
    name: Lint and Unit Tests
    uses: ./.github/workflows/lint-and-test.yml

  integration-test:
    name: Integration Tests
    uses: ./.github/workflows/integration-test.yml

  integration-test-proxy:
    name: Integration Proxy Tests
    uses: ./.github/workflows/integration-test-proxy.yml

  required-status-checks:
    name: "Required Status Checks"  # do not change, used in ruleset "Required Status Checks"
    if: ${{ always() }}
    needs:
      - super-linter
      - lint-and-test
      - integration-test
      - integration-test-proxy
    runs-on: ubuntu-latest
    steps:
      - name: Check validation job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status \
            'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "$NEEDS"

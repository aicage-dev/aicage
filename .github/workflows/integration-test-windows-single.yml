name: Integration Tests (Windows Single Job)

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-windows:
    name: Integration tests on windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        shell: bash
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up WSL
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4  # v7.2.0
        with:
          distribution: Ubuntu-26.04
          update: "true"
          additional-packages: docker.io python3-venv

      - name: Start Docker daemon
        shell: wsl-bash -u root {0}
        run: |
          nohup dockerd > /var/log/dockerd.log 2>&1 &
          for _ in {1..30}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /var/log/dockerd.log
          exit 1

      - name: Validate Linux Docker engine
        shell: wsl-bash -u root {0}
        run: |
          test "$(docker info --format '{{.OSType}}')" = linux

      - name: Install Python dependencies
        shell: wsl-bash -u root {0}
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run WSL Docker integration tests
        shell: wsl-bash -u root {0}
        env:
          AICAGE_RUN_INTEGRATION: "1"
        run: |
          . .venv/bin/activate
          pytest -m "integration and not proxy_integration"

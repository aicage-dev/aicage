name: Integration Tests (Windows)

"on":
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-discover:
    name: Discover Integration Tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validating config with schemas
        run: |
          scripts/validate-config-with-schemas.sh

      - id: collect
        name: Collect integration tests
        run: scripts/collect-integration-test-matrix.py

  integration-windows:
    name: Integration (${{ matrix.test }})
    runs-on: windows-latest
    needs: integration-discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.integration-discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        shell: bash
        run: |
          scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Skrog
        uses: wslkit/setup-skrog@cd2cba80924975b0c77217947c228da8aac17b1f
        with:
          version: "0.10.0"

      - name: Install and configure Skrog Docker CLI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          skrog cli install --no-path
          $cliStatus = skrog cli status --json | ConvertFrom-Json
          $cliBinDir = $cliStatus.binDir
          if (-not $cliBinDir -or -not (Test-Path -LiteralPath $cliBinDir)) {
            throw "Skrog Docker CLI bin directory was not found: $cliBinDir"
          }
          $dockerConfig = Join-Path $env:USERPROFILE ".docker"
          if (-not (Test-Path -LiteralPath $dockerConfig)) {
            throw "Skrog Docker config directory was not found: $dockerConfig"
          }

          $dockerCli = Join-Path $env:WINDIR "System32\docker.exe"
          if (-not (Test-Path -LiteralPath $dockerCli)) {
            throw "Expected preinstalled Docker CLI was not found: $dockerCli"
          }
          Remove-Item -LiteralPath $dockerCli -Force
          Add-Content -Path $env:GITHUB_PATH -Value $cliBinDir
          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_CONFIG=$dockerConfig"

      - name: Validate Windows Docker CLI
        shell: powershell
        run: |
          if ((docker context show) -ne "skrog") {
            throw "Expected Docker context 'skrog'."
          }
          if ((docker info --format '{{.OSType}}') -ne "linux") {
            throw "Expected a Linux Docker engine."
          }
          docker buildx version
          docker buildx imagetools inspect --raw ghcr.io/aicage-dev/aicage:codex-ubuntu | Out-Null
          docker run --rm --mount "type=bind,src=$env:RUNNER_TEMP,dst=/host,readonly" alpine:3.22 test -d /host

          $dockerHost = docker context inspect skrog --format '{{.Endpoints.docker.Host}}'
          if ($dockerHost -notmatch '^npipe:////') {
            throw "Expected Skrog to use a named-pipe Docker endpoint, got: $dockerHost"
          }
          $pipePath = $dockerHost -replace '^npipe:////', '//'
          docker run --rm `
            --mount "type=bind,src=$pipePath,dst=/var/run/docker.sock" `
            --env DOCKER_HOST=unix:///var/run/docker.sock `
            docker:29-cli version --format '{{.Server.Os}}'

      - name: Run Windows Docker integration tests
        shell: bash
        env:
          AICAGE_RUN_INTEGRATION: "1"
          TEST_NODE: ${{ matrix.test }}
        run: |
          pytest -m "integration and not proxy_integration" "$TEST_NODE"

      - name: Collect Docker diagnostics
        if: failure()
        shell: powershell
        run: |
          docker context inspect skrog
          docker info
          skrog status --json
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\src"
          @'
          import traceback

          import docker

          from aicage.docker.runtime import get_active_docker_host

          host = get_active_docker_host()
          print(f"aicage Docker SDK host: {host.host}")
          try:
              print(docker.DockerClient(base_url=host.host, timeout=10).version())
          except Exception:
              traceback.print_exc()
          '@ | python -

      - name: Collect aicage logs
        if: failure()
        shell: powershell
        env:
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "aicage-logs-$env:JOB_INDEX"
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA "Temp") -Directory -Filter "aicage-test-home-*" |
            ForEach-Object {
              Copy-Item -Recurse -Force $_.FullName $artifactDirectory
            }

      - name: Upload aicage logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: aicage-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/aicage-logs-${{ strategy.job-index }}
          if-no-files-found: ignore
          include-hidden-files: true

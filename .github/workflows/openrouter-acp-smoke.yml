name: OpenRouter ACP Smoke Test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build aicage wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Syncing metadata and agents with sub-project 'aicage-image'
        run: scripts/sync-with-aicage-image-projects.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: aicage-wheel
          path: dist/*.whl
          if-no-files-found: error

  smoke-test:
    name: OpenRouter ACP smoke (${{ matrix.name }})
    needs: build-wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            runner: ubuntu-latest
            platform: unix
          - name: Ubuntu ARM64
            runner: ubuntu-24.04-arm
            platform: unix
          - name: Windows x64
            runner: windows-latest
            platform: windows
          - name: macOS
            runner: macos-26-intel
            platform: macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: aicage-wheel
          path: dist

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install wheel
        if: matrix.platform != 'windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Install wheel
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          if ($null -eq $wheel) {
            throw "The aicage wheel artifact is missing."
          }
          python -m pip install $wheel.FullName

      - name: Set up Docker Desktop
        if: matrix.platform == 'macos'
        uses: gh-workflow/setup-docker-desktop-macos@e20c593ec686d9af896d5db1f033e8d71fd82d67  # 0.0.12
        with:
          print_diagnostics: true

      - name: Prepare WSL2 Linux Docker daemon
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $distros = wsl --list --quiet
          if (-not ($distros -match "^Ubuntu")) {
            wsl --install -d Ubuntu
          }
          wsl --list --verbose
          wsl --set-version Ubuntu 2
          wsl -d Ubuntu -u root -- bash -lc `
            "apt-get update && apt-get install -y docker.io"
          wsl -d Ubuntu -u root -- bash -lc `
            "nohup dockerd -H tcp://0.0.0.0:2375 -H unix:///var/run/docker.sock > /var/log/dockerd.log 2>&1 &"
          wsl -d Ubuntu -u root -- bash -lc `
            "for i in {1..30}; do docker info >/dev/null 2>&1 && break; sleep 2; done"
          $wslIp = wsl -d Ubuntu -- bash -lc `
            "hostname -I | awk '{print $1}'"
          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_HOST=tcp://$wslIp:2375"

      - name: Verify Linux Docker engine
        shell: bash
        run: |
          test "$(docker info --format '{{.OSType}}')" = linux

      - name: Run OpenRouter ACP smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/test-openrouter-acp.py

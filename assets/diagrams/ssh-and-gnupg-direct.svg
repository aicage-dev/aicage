<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Direct SSH and GnuPG socket sharing</title>
  <desc id="desc">Host public keys are shared with the Aicage container. Host SSH and GnuPG agents use private keys and
    communicate with matching tools in the Aicage container through Unix sockets. The coding agent uses those tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41536d"/>
    </marker>
    <style>
      .panel { stroke-width: 2; }
      .host { fill: #eef6ff; stroke: #7aa7d9; }
      .container { fill: #f7f2ff; stroke: #9b85c7; }
      .node { fill: #fff; stroke: #718096; stroke-width: 1.5; }
      .private { fill: #fff4e5; stroke: #d68a35; stroke-width: 1.5; }
      .process { fill: #e6f6f0; stroke: #3b9b7a; stroke-width: 1.5; }
      .tool { fill: #f2edff; stroke: #8266b5; stroke-width: 1.5; }
      .coding { fill: #e9edff; stroke: #5973c8; stroke-width: 1.5; }
      .heading { font: 700 20px system-ui, sans-serif; fill: #1e2b3b; }
      .label { font: 600 16px system-ui, sans-serif; fill: #263548; }
      .subtle { font: 14px system-ui, sans-serif; fill: #526477; }
      .edge { fill: none; stroke: #41536d; stroke-width: 2; marker-end: url(#arrow); }
      .socket { fill: none; stroke: #256d9a; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .label-bg { fill: #fff; stroke: #c7d4e1; stroke-width: 1; }
    </style>
  </defs>

  <rect x="28" y="28" width="536" height="544" rx="20" class="panel host"/>
  <text x="60" y="72" class="heading">Host</text>

  <rect x="636" y="28" width="536" height="544" rx="20" class="panel container"/>
  <text x="668" y="72" class="heading">Aicage container</text>

  <rect x="72" y="116" width="190" height="58" rx="10" class="node"/>
  <text x="167" y="151" text-anchor="middle" class="label">SSH public keys</text>
  <rect x="72" y="202" width="190" height="58" rx="10" class="node"/>
  <text x="167" y="237" text-anchor="middle" class="label">GnuPG public keys</text>

  <rect x="72" y="374" width="190" height="58" rx="10" class="private"/>
  <text x="167" y="409" text-anchor="middle" class="label">SSH private keys</text>
  <rect x="72" y="460" width="190" height="58" rx="10" class="private"/>
  <text x="167" y="495" text-anchor="middle" class="label">GnuPG private keys</text>

  <rect x="330" y="358" width="174" height="72" rx="12" class="process"/>
  <text x="417" y="389" text-anchor="middle" class="label">SSH agent</text>
  <text x="417" y="411" text-anchor="middle" class="subtle">host process</text>
  <rect x="330" y="444" width="174" height="72" rx="12" class="process"/>
  <text x="417" y="475" text-anchor="middle" class="label">GnuPG agent</text>
  <text x="417" y="497" text-anchor="middle" class="subtle">host process</text>

  <rect x="680" y="116" width="190" height="58" rx="10" class="node"/>
  <text x="775" y="151" text-anchor="middle" class="label">SSH public keys</text>
  <rect x="680" y="202" width="190" height="58" rx="10" class="node"/>
  <text x="775" y="237" text-anchor="middle" class="label">GnuPG public keys</text>

  <rect x="922" y="358" width="174" height="72" rx="12" class="tool"/>
  <text x="1009" y="389" text-anchor="middle" class="label">SSH tools</text>
  <text x="1009" y="411" text-anchor="middle" class="subtle">client tools</text>
  <rect x="922" y="444" width="174" height="72" rx="12" class="tool"/>
  <text x="1009" y="475" text-anchor="middle" class="label">GnuPG tools</text>
  <text x="1009" y="497" text-anchor="middle" class="subtle">client tools</text>

  <rect x="710" y="506" width="180" height="48" rx="12" class="coding"/>
  <text x="800" y="536" text-anchor="middle" class="label">Coding agent</text>

  <path d="M 262 145 H 680" class="edge"/>
  <rect x="432" y="128" width="78" height="28" rx="8" class="label-bg"/>
  <text x="471" y="148" text-anchor="middle" class="subtle">files</text>
  <path d="M 262 231 H 680" class="edge"/>
  <rect x="432" y="214" width="78" height="28" rx="8" class="label-bg"/>
  <text x="471" y="234" text-anchor="middle" class="subtle">files</text>

  <path d="M 262 403 H 330" class="edge"/>
  <path d="M 262 489 H 330" class="edge"/>

  <path d="M 504 394 H 922" class="socket"/>
  <rect x="658" y="377" width="110" height="30" rx="8" class="label-bg"/>
  <text x="713" y="398" text-anchor="middle" class="subtle">SSH socket</text>
  <path d="M 504 480 H 922" class="socket"/>
  <rect x="646" y="463" width="134" height="30" rx="8" class="label-bg"/>
  <text x="713" y="484" text-anchor="middle" class="subtle">GnuPG socket</text>

  <path d="M 922 394 L 880 518" class="socket"/>
  <path d="M 922 480 L 880 540" class="socket"/>
</svg>
